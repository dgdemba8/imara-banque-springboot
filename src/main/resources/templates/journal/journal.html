<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
               xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
               layout:decorate="~{base}">
<head>
    <title>Journal des connexions — Imara Banque</title>
</head>

<th:block layout:fragment="content">

<main class="container my-4">
    <h2 class="mb-4" style="color: #2d3748;">📋 Journal des connexions</h2>

    <div class="card border-0 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center py-2"
             style="background-color: #2d3748; color: white;">
            <strong>Historique de vos connexions</strong>
            <span class="badge" style="background-color: #d4a843; color: #2d3748;"
                  th:text="${#lists.size(connexions)} + ' entrée(s)'">
            </span>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead style="background-color: #edf2f7;">
                    <tr>
                        <th class="small text-muted">Date &amp; Heure</th>
                        <th class="small text-muted">Adresse IP</th>
                        <th class="small text-muted">Résultat</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(connexions)}">
                        <td colspan="3" class="text-center text-muted py-4">
                            Aucune connexion enregistrée.
                        </td>
                    </tr>
                    <tr th:each="c : ${connexions}"
                        th:classappend="${!c.succes} ? 'table-danger bg-opacity-25' : ''">
                        <td>
                            <span th:text="${#temporals.format(c.dateConnexion, 'dd/MM/yyyy')}"></span>
                            <span class="text-muted ms-1"
                                  th:text="${'à ' + #temporals.format(c.dateConnexion, 'HH:mm:ss')}">
                            </span>
                        </td>
                        <td>
                            <code class="small" th:text="${c.adresseIp != null ? c.adresseIp : '—'}"></code>
                        </td>
                        <td>
                            <span th:if="${c.succes}"  class="badge bg-success">✓ Succès</span>
                            <span th:unless="${c.succes}" class="badge bg-danger">✗ Échec</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary btn-sm">
            ← Retour au tableau de bord
        </a>
    </div>
</main>

</th:block>
</html>
