<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <!--
    ╔══════════════════════════════════════════════════════════════╗
    ║  CONVERSIONS DJANGO → THYMELEAF                              ║
    ║  {% load static %}          → supprimé (inutile)             ║
    ║  {% static 'x' %}           → th:href="@{/x}"               ║
    ║  {% block content %}        → th:fragment dans chaque page   ║
    ║  {% include 'x.html' %}     → th:replace="~{x :: fragment}"  ║
    ╚══════════════════════════════════════════════════════════════╝
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Token CSRF pour AJAX (refresh-session) -->
    <meta name="_csrf"        th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">

    <title>Imara Banque</title>

    <!-- {% static 'css/bootstrap.min.css' %} → th:href="@{/css/bootstrap.min.css}" -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            background-image:
                linear-gradient(
                    135deg,
                    rgba(45, 55, 72, 0.82) 0%,
                    rgba(29, 36, 50, 0.88) 50%,
                    rgba(45, 55, 72, 0.82) 100%
                ),
                url('https://images.unsplash.com/photo-1515694346937-94d85e41e6f0?w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    </style>
</head>

<!--
    {% include 'inactivity_popup.html' %} → th:replace="~{inactivity_popup :: popup}"
    Le popup est inclus AVANT <body> comme dans Django.
-->
<th:block th:replace="~{inactivity_popup :: popup}"></th:block>

<body>

    <!--
        {% include 'header.html' %} → th:replace="~{header :: header}"
    -->
    <th:block th:replace="~{header :: header}"></th:block>

    <main class="container mb-5" style="padding-top: 82px;">
        <!--
            {% block content %}{% endblock %}
            → Dans Thymeleaf, chaque page étend base.html via th:replace
              et définit son propre contenu directement dans le <main>.
              Pas de "block" : chaque page est autonome et inclut header/footer.
        -->
    </main>

    <!--
        {% include 'footer.html' %} → th:replace="~{footer :: footer}"
    -->
    <th:block th:replace="~{footer :: footer}"></th:block>

    <!-- {% static 'js/...' %} → th:src="@{/js/...}" -->
    <script th:src="@{/js/jquery-3.5.1.slim.min.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
