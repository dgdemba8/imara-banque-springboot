<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe — Imara Banque</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="background-color: #f7f5f0; min-height: 100vh;">

<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card shadow-lg border-0" style="max-width: 420px; width: 100%;">

        <!-- En-tête -->
        <div class="card-header text-center py-4"
             style="background-color: #2d3748; border-bottom: 3px solid #d4a843;">
            <img th:src="@{/images/logo.png}" alt="Logo" height="55" class="mb-2">
            <h4 style="font-family: Georgia, serif; font-style: italic; color: #d4a843; margin: 0;">
                Imara Banque
            </h4>
            <small style="color: #a0aec0; font-size: 0.75rem; letter-spacing: 1px;">
                ESPACE CLIENT SÉCURISÉ
            </small>
        </div>

        <div class="card-body p-4">
            <h5 class="text-center mb-2" style="color: #2d3748;">Connexion — Étape 2/2</h5>

            <!-- Username affiché (en lecture seule) -->
            <div class="alert py-2 mb-3" style="background-color: #edf2f7; border: none;">
                <small class="text-muted">Identifiant :</small>
                <strong th:text="${username}" class="ms-1" style="color: #2d3748;">username</strong>
            </div>

            <!-- Tentatives restantes -->
            <div th:if="${tentativesRestantes != null}"
                 class="text-center mb-3">
                <small th:classappend="${tentativesRestantes == 1} ? 'text-danger fw-bold' : 'text-muted'">
                    <!-- Équivalent du compteur tentatives Django -->
                    <span th:if="${tentativesRestantes > 0}"
                          th:text="'Tentatives restantes : ' + ${tentativesRestantes}">
                    </span>
                </small>
            </div>

            <!-- Message d'erreur -->
            <div th:if="${erreur}" class="alert alert-danger py-2 small" th:text="${erreur}"></div>

            <!-- Formulaire mot de passe -->
            <form th:action="@{/auth/password/}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Mot de passe</label>
                    <div class="input-group">
                        <input type="password"
                               id="password"
                               name="password"
                               class="form-control form-control-lg"
                               placeholder="Votre mot de passe"
                               autocomplete="current-password"
                               autofocus
                               required>
                        <button type="button"
                                class="btn btn-outline-secondary"
                                id="toggle-pwd"
                                title="Afficher/masquer">
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-lg w-100 fw-bold mb-3"
                        style="background-color: #d4a843; color: #2d3748; border: none;">
                    Se connecter
                </button>

                <!-- Retour étape 1 -->
                <div class="text-center">
                    <a th:href="@{/auth/}" class="text-muted small">
                        ← Changer d'identifiant
                    </a>
                </div>
            </form>
        </div>

        <div class="card-footer text-center py-3" style="background-color: #f7f5f0;">
            <small class="text-muted">🔒 Connexion sécurisée — Imara Banque</small>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    // Afficher/masquer mot de passe
    document.getElementById('toggle-pwd').addEventListener('click', function() {
        const input = document.getElementById('password');
        input.type = input.type === 'password' ? 'text' : 'password';
    });
</script>
</body>
</html>
