# Serveur
server.port=8080
server.servlet.session.timeout=1800s

# Base de données MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/imara_banque?useSSL=false&serverTimezone=Africa/Dakar&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=390453
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de connexions HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Dakar

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Internationalisation
spring.web.locale=fr_FR
spring.mvc.locale-resolver=fixed

# Fichiers statiques
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# Email SMTP (Gmail)
# Renseignez votre email et mot de passe d'application Gmail ici
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=VOTRE_EMAIL@gmail.com
spring.mail.password=VOTRE_MOT_DE_PASSE_APPLICATION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.default-encoding=UTF-8

# Scheduler (remplace Celery Beat)
# Activé via @EnableScheduling dans ImaraBanqueApplication.java

# Logging 
logging.level.root=INFO
logging.level.com.imara.banque=DEBUG
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss} %-5level [%logger{36}] - %msg%n

# Sécurité 
app.security.secret-key=imara-banque-secret-key-2025-dakar-xK9mP3qR7vL2nW

# Constantes métier 
app.virement.seuil-email=200000
app.virement.delai-annulation-minutes=5
app.connexion.max-tentatives=3
app.connexion.duree-blocage-minutes=15
app.connexion.fenetre-alerte-minutes=10
app.connexion.nb-connexions-alerte=2